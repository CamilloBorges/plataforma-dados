# Projeto dbt da plataforma de dados: transformações em camadas (origem -> staging -> marts).
# Começou em 13/10/2026 com a Rentabilidade por Setor (porta do notebook "Fato Item" do Fabric).
# As views antigas de transformacao/api/*.sql continuam no materializar.py até migrarem.
name: bomgado
version: "1.0"
profile: bomgado

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: target
clean-targets: ["target", "dbt_packages"]

flags:
  send_anonymous_usage_stats: false

models:
  bomgado:
    staging:
      # Staging: uma view por fonte, só renomeia, tipa e filtra. Schema "stg".
      +materialized: view
      +schema: stg
    intermediate:
      # Regras de negócio que ainda não são a tabela final (ex.: estoque inicial do mês).
      # Ficam no "stg" para o MCP e a conferência lerem.
      +materialized: view
      +schema: stg

vars:
  # Primeiro mês com estoque do Logus completo no início do mês (o Logus entrou em julho/2026;
  # antes disso o estoque vem do PlenoKW, num modelo próprio).
  inicio_logus: "2026-08-01"
