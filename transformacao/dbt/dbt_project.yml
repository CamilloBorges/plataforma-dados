# Projeto dbt da plataforma de dados: transformações em camadas (origem -> staging -> marts).
# Começou em 13/10/2026 com a Rentabilidade por Setor (porta do notebook "Fato Item" do Fabric).
# As views antigas de transformacao/api/*.sql continuam no materializar.py até migrarem.
name: bomgado
version: "1.0"
profile: bomgado

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: target
clean-targets: ["target", "dbt_packages"]

flags:
  send_anonymous_usage_stats: false

models:
  bomgado:
    staging:
      # Staging: uma view por fonte, só renomeia, tipa e filtra. Schema "stg".
      +materialized: view
      +schema: stg
    intermediate:
      # Regras de negócio que ainda não são a tabela final (ex.: estoque inicial do mês).
      # Ficam no "stg" para o MCP e a conferência lerem.
      +materialized: view
      +schema: stg

    marts:
      # Tabelas finais no schema "api", lidas pela OData (que só lista api.vw_* com chave primária).
      # O comentário "dbt: ..." protege a tabela da limpeza de órfãs (transformacao/materializar.py).
      +materialized: table
      +schema: api
      +post-hook:
        - "alter table {{ this }} add primary key (id)"
        - "comment on table {{ this }} is 'dbt: {{ this.name }} (transformacao/dbt)'"

on-run-end:
  # Listas de departamentos e de seções do Directus (infra/postgres/config/05 e 06): incluem os
  # departamentos e as seções novos do Logus a cada dbt build (a seção depois do departamento).
  - "insert into config.logus_departamento (departamento, codigo) select trim(dcr_depto), cdg_depto::int from raw_logus.caddepto where trim(coalesce(dcr_depto, '')) <> '' on conflict (departamento) do update set codigo = excluded.codigo where config.logus_departamento.codigo is distinct from excluded.codigo"
  - "insert into config.logus_secao (codigo, secao, departamento) select s.cdg_secao::int, trim(s.dcr_secao), trim(d.dcr_depto) from raw_logus.cadsecao s join raw_logus.caddepto d on d.cdg_depto = s.cdg_depto where trim(coalesce(s.dcr_secao, '')) <> '' on conflict (codigo) do update set secao = excluded.secao, departamento = excluded.departamento where (config.logus_secao.secao, config.logus_secao.departamento) is distinct from (excluded.secao, excluded.departamento)"

vars:
  # Primeiro mês com estoque do Logus completo no início do mês (o Logus entrou em julho/2026;
  # antes disso o estoque vem do PlenoKW, num modelo próprio).
  inicio_logus: "2026-08-01"
