# Plataforma de dados Bomgado: Postgres (dados + metadados do Airflow) e Airflow 3 (LocalExecutor).
# Deploy no EasyPanel (App > Docker Compose, arquivo docker-compose.yml na raiz: o EasyPanel grava o .env na raiz, e o compose só lê o .env da própria pasta).
# Nenhuma porta é publicada no host: o Postgres só é acessível pela rede interna do compose,
# e a interface do Airflow pelo túnel da Cloudflare (serviço "airflow-apiserver", porta 8080).
#
# Pensado para o VPS de 8 GB compartilhado: memória limitada por serviço, paralelismo baixo,
# sem Celery/Redis. Tudo configurável por variáveis de ambiente (ver .env.example).

x-airflow: &airflow
  build:
    context: .
    dockerfile: orquestracao/Dockerfile
  restart: unless-stopped
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__PARALLELISM: "2"
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "2"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: America/Sao_Paulo
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?defina AIRFLOW_FERNET_KEY}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    # Login único pelo Cloudflare Access (Entra ID) em airflow.bomgado.net: o Airflow não pede
    # senha própria e trata todo acesso como admin. Seguro só porque não há porta publicada e o
    # único caminho externo é o túnel com Access. Não publicar a porta 8080 sem religar o login.
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@postgres:5432/airflow
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?defina AIRFLOW_JWT_SECRET}
    AIRFLOW__API__WORKERS: "1"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # Conexão usada pelos extratores (schemas raw_*), com usuário próprio.
    DADOS_DB_URL: postgresql://ingestao:${INGESTAO_DB_PASSWORD}@postgres:5432/dados
    JETBOV_USER: ${JETBOV_USER:-}
    JETBOV_PASSWORD: ${JETBOV_PASSWORD:-}
  volumes:
    - airflow-logs:/opt/airflow/logs
  depends_on:
    airflow-init:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:17.11
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:?defina AIRFLOW_DB_PASSWORD}
      INGESTAO_DB_PASSWORD: ${INGESTAO_DB_PASSWORD:?defina INGESTAO_DB_PASSWORD}
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=16MB
      - -c
      - max_connections=60
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1G

  # Execução única a cada deploy: migra o banco de metadados do Airflow.
  airflow-init:
    <<: *airflow
    restart: "no"
    command: ["db", "migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  airflow-apiserver:
    <<: *airflow
    command: ["api-server"]
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 768M

  airflow-scheduler:
    <<: *airflow
    command: ["scheduler"]
    deploy:
      resources:
        limits:
          memory: 1G

  airflow-dag-processor:
    <<: *airflow
    command: ["dag-processor"]
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  postgres-data:
  airflow-logs:
