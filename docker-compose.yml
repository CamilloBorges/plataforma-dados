# Plataforma de dados Bomgado: Postgres (dados + metadados do Airflow) e Airflow 3 (LocalExecutor).
# Deploy no EasyPanel (App > Docker Compose, arquivo docker-compose.yml na raiz: o EasyPanel grava o .env na raiz, e o compose só lê o .env da própria pasta).
# Nenhuma porta é publicada no host: o Postgres só é acessível pela rede interna do compose,
# e a interface do Airflow pelo túnel da Cloudflare (serviço "airflow-apiserver", porta 8080).
#
# Pensado para o VPS de 8 GB compartilhado: memória limitada por serviço, paralelismo baixo,
# sem Celery/Redis.
#
# Segredos: vêm do Azure Key Vault (kv-bomgado-dados). No ambiente do EasyPanel ficam só as 4
# variáveis de acesso ao cofre (ver .env.example). O serviço "segredos" é o único que fala com o
# cofre; ele entrega a cada consumidor, num volume em memória exclusivo, só as senhas que ele usa,
# e o com_segredos.sh do consumidor as carrega antes de iniciar o processo.
# Nome no cofre = variável em minúsculas com hífen (POSTGRES_PASSWORD -> postgres-password).

x-airflow: &airflow
  build:
    context: .
    dockerfile: orquestracao/Dockerfile
  restart: unless-stopped
  entrypoint: ["sh", "/opt/airflow/com_segredos.sh", "sh", "/opt/airflow/entrypoint.sh"]
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__PARALLELISM: "2"
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "2"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: America/Sao_Paulo
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    # Login único pelo Cloudflare Access (Entra ID) em airflow.bomgado.net: o Airflow não pede
    # senha própria e trata todo acesso como admin. Seguro só porque não há porta publicada e o
    # único caminho externo é o túnel com Access. Não publicar a porta 8080 sem religar o login.
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    AIRFLOW__API__WORKERS: "1"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # Conexão do banco, Fernet, JWT e DADOS_DB_URL: montados em orquestracao/entrypoint.sh.
  volumes:
    - airflow-logs:/opt/airflow/logs
    - segredos-airflow:/run/segredos:ro
  depends_on:
    segredos:
      condition: service_healthy
    airflow-init:
      condition: service_completed_successfully

services:
  # Único serviço com a credencial do cofre (só leitura). Um grupo SEGREDOS_<GRUPO> por
  # consumidor: variáveis separadas por espaço, "?" = opcional. Ver infra/segredos/segredos.py.
  segredos:
    build: ./infra/segredos
    restart: unless-stopped
    environment:
      KEYVAULT_URL: ${KEYVAULT_URL:?defina KEYVAULT_URL}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:?defina AZURE_TENANT_ID}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:?defina AZURE_CLIENT_ID}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:?defina AZURE_CLIENT_SECRET}
      SEGREDOS_POSTGRES: POSTGRES_PASSWORD AIRFLOW_DB_PASSWORD INGESTAO_DB_PASSWORD API_DB_PASSWORD MCP_DB_PASSWORD
      SEGREDOS_AIRFLOW: AIRFLOW_DB_PASSWORD INGESTAO_DB_PASSWORD AIRFLOW_FERNET_KEY AIRFLOW_JWT_SECRET JETBOV_USER JETBOV_PASSWORD
      SEGREDOS_API: API_DB_PASSWORD ENTRA_TENANT_ID ENTRA_AUDIENCE ENTRA_GROUP_ID?
      SEGREDOS_MCP: MCP_DB_PASSWORD
    volumes:
      - segredos-postgres:/run/segredos/postgres
      - segredos-airflow:/run/segredos/airflow
      - segredos-api:/run/segredos/api
      - segredos-mcp:/run/segredos/mcp
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/pronto"]
      interval: 5s
      timeout: 3s
      retries: 30
    deploy:
      resources:
        limits:
          memory: 128M

  postgres:
    image: postgres:17.11
    restart: unless-stopped
    entrypoint: ["sh", "/usr/local/bin/com_segredos.sh", "docker-entrypoint.sh"]
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=16MB
      - -c
      - max_connections=60
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/initdb:/docker-entrypoint-initdb.d:ro
      - ./infra/segredos/com_segredos.sh:/usr/local/bin/com_segredos.sh:ro
      - segredos-postgres:/run/segredos:ro
    depends_on:
      segredos:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1G

  # Execução única a cada deploy: papéis, schemas e permissões (idempotente; ver o script).
  db-setup:
    image: postgres:17.11
    restart: "no"
    volumes:
      - ./infra/postgres/setup.sh:/setup.sh:ro
      - ./infra/segredos/com_segredos.sh:/usr/local/bin/com_segredos.sh:ro
      - segredos-postgres:/run/segredos:ro
    entrypoint: ["sh", "/usr/local/bin/com_segredos.sh", "sh", "/setup.sh"]
    depends_on:
      postgres:
        condition: service_healthy

  # Execução única a cada deploy: migra o banco de metadados do Airflow.
  airflow-init:
    <<: *airflow
    restart: "no"
    command: ["db", "migrate"]
    depends_on:
      postgres:
        condition: service_healthy
      db-setup:
        condition: service_completed_successfully

  airflow-apiserver:
    <<: *airflow
    command: ["api-server"]
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 768M

  airflow-scheduler:
    <<: *airflow
    command: ["scheduler"]
    deploy:
      resources:
        limits:
          memory: 1G

  airflow-dag-processor:
    <<: *airflow
    command: ["dag-processor"]
    deploy:
      resources:
        limits:
          memory: 512M

  # Gateway OData do Excel/Power BI (login do Entra ID). Domínio: dados-api.bomgado.net, porta 8000.
  dados-api:
    build: ./dados-api
    restart: unless-stopped
    entrypoint: ["sh", "/usr/local/bin/com_segredos.sh"]
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*"]
    volumes:
      - ./infra/segredos/com_segredos.sh:/usr/local/bin/com_segredos.sh:ro
      - segredos-api:/run/segredos:ro
    depends_on:
      db-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M

  # MCP de SQL somente leitura (substitui o Directus/MCP pleno). Domínio: dados-mcp.bomgado.net,
  # porta 8083, atrás do token de serviço do Cloudflare Access (como os demais MCPs).
  mcp-sql:
    build: ./mcp-sql
    restart: unless-stopped
    entrypoint: ["sh", "/usr/local/bin/com_segredos.sh"]
    command: ["python", "server.py"]
    volumes:
      - ./infra/segredos/com_segredos.sh:/usr/local/bin/com_segredos.sh:ro
      - segredos-mcp:/run/segredos:ro
    environment:
      MCP_TRUSTED_HOSTS: ${MCP_TRUSTED_HOSTS:-dados-mcp.bomgado.net}
    depends_on:
      db-setup:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 256M

# Segredos: tmpfs (só em memória, nunca no disco). Um volume por consumidor. O conteúdo some quando
# nenhum contêiner o usa; o serviço "segredos" fica no ar justamente para mantê-lo.
x-tmpfs: &tmpfs
  driver: local
  driver_opts:
    type: tmpfs
    device: tmpfs
    o: size=64k,mode=0755

volumes:
  postgres-data:
  airflow-logs:
  segredos-postgres: *tmpfs
  segredos-airflow: *tmpfs
  segredos-api: *tmpfs
  segredos-mcp: *tmpfs
