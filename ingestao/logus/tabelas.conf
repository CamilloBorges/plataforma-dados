# Tabelas copiadas do ERP atual (Informix bd_bomgado_m, Logus) para o schema raw_logus.
# Formato: <tabela>  <agenda>   agenda = "15min" (ou "Nmin") ou "diario HH:MM".
# Uma DAG logus_<agenda> por agenda; ao terminar, ela publica o asset raw_logus_<agenda>, que
# dispara as views de transformacao/api com "-- atualizar: após raw_logus_<agenda>".
# Cópia completa a cada execução (volumes pequenos: vnditenspdv tinha 54 mil itens em 25/09/2026).
# Tabela que passar de ~500 mil linhas deve ganhar carga incremental.

